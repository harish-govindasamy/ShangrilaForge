name: shangrila_engineers_app
description: "Shangrila Engineers - Employee & Project Management System"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.5
  equatable: ^2.0.5

  # Networking
  http: ^1.1.0
  dio: ^5.3.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # Date & Time
  intl: ^0.19.0

  # Utilities
  uuid: ^4.2.1
  dartz: ^0.10.1
  logging: ^1.2.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Excel Generation
  excel: ^4.0.3

  # Email
  mailer: ^6.0.1

  # Image Caching
  cached_network_image: ^3.3.1

  # Encryption
  encrypt: ^5.0.1

  # Error Monitoring
  firebase_crashlytics: ^3.4.15
  firebase_analytics: ^10.8.6

  # Performance Monitoring
  firebase_performance: ^0.9.3+14

  # Background Tasks
  workmanager: ^0.5.2

  # Connectivity
  connectivity_plus: ^5.0.2

  # Device Info
  device_info_plus: ^10.1.0

  # Path Provider
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
