name: shangrila_engineers_app
description: "Shangrila Engineers - Employee & Project Management System"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.5
  equatable: ^2.0.5

  # Networking
  http: ^1.1.0
  dio: ^5.3.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # Date & Time
  intl: ^0.20.2

  # Utilities
  uuid: ^4.2.1
  dartz: ^0.10.1
  logging: ^1.2.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Excel Generation
  excel: ^4.0.3

  # Email
  mailer: ^6.0.1

  # Image Caching
  cached_network_image: ^3.3.1

  # Encryption
  encrypt: ^5.0.1

  # Error Monitoring
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1

  # Performance Monitoring
  firebase_performance: ^0.11.0+1

  # Background Tasks
  workmanager: ^0.9.0+3

  # Connectivity
  connectivity_plus: ^6.1.0

  # Device Info
  device_info_plus: ^11.5.0

  # Path Provider
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: 4.0.7
  characters: 1.4.1
  flutter_secure_storage_linux: 2.0.1
  flutter_secure_storage_macos: 4.0.0
  flutter_secure_storage_platform_interface: 2.0.1
  flutter_secure_storage_web: 2.0.0
  flutter_secure_storage_windows: 4.0.0
  image: 4.5.4
  material_color_utilities: 0.13.0
  meta: 1.17.0
  pointycastle: 4.0.0
  test_api: 0.7.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
